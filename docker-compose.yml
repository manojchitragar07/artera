version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: artera_user
      POSTGRES_PASSWORD: artera_password
      POSTGRES_DB: artera_db
    ports:
      - "5433:5432"
    volumes:
      - artera_pgdata:/var/lib/postgresql/data

volumes:
  artera_pgdata:
